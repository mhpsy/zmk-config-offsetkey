manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: kumamuk-git
      url-base: https://github.com/kumamuk-git
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: eyelash
      url-base: https://github.com/a741725193
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: a741725193
      url-base: https://github.com/a741725193
    - name: mhpsy
      url-base: https://github.com/mhpsy
  projects:
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      # Pinned to last pre-"migrate-to-v4" commit (851661cd, 2026-02-06).
      # main merged the zmk-v0.4 migration on 2026-05-30, which breaks against
      # our pinned zmk v0.3 fork. Do NOT use `main`.
      revision: 851661cd2
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      # Pinned to last pre-"migrate-to-v4" commit (dbf92f76, 2026-02-24).
      # main merged the zmk-v0.4 migration on 2026-05-30 (added an arg to
      # zmk_keymap_layer_activate), which breaks against our pinned zmk v0.3
      # fork. Do NOT use `main`.
      revision: dbf92f764
    - name: zmk-pmw3610-driver
      # Fork of cormoran/zmk-pmw3610-driver, branched off 274c92b (the last
      # pixart,pmw3610-compatible commit, matching our overlay + v0.3 zmk fork).
      # Forces a full sensor re-init on the ACTIVE/wake transition (fixes the
      # stuck-motion runaway after waking), plus CONFIG_PMW3610_MAX_DELTA which
      # drops a single implausibly-large sample (the stale frame that sneaks out
      # right at wake before re-init takes over).
      # Branch: wake-reinit
      remote: mhpsy
      revision: 40a56e270ba0c11c3c6a2f477eba64f973c89955
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    - name: zmk-board-eyelash
      remote: eyelash
      revision: main
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim
      revision: main
    - name: zmk-tog-io
      remote: a741725193
      revision: main
  self:
    path: config

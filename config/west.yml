    - name: eyelash
      url-base: https://github.com/a741725193
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: a741725193
      url-base: https://github.com/a741725193
    - name: mhpsy
      url-base: https://github.com/mhpsy
  projects:
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      # Pinned to last pre-"migrate-to-v4" commit (851661cd, 2026-02-06).
      # main merged the zmk-v0.4 migration on 2026-05-30, which breaks against
      # our pinned zmk v0.3 fork. Do NOT use `main`.
      revision: 851661cd2
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      # Pinned to last pre-"migrate-to-v4" commit (dbf92f76, 2026-02-24).
      # main merged the zmk-v0.4 migration on 2026-05-30 (added an arg to
      # zmk_keymap_layer_activate), which breaks against our pinned zmk v0.3
      # fork. Do NOT use `main`.
      revision: dbf92f764
    - name: zmk-pmw3610-driver
      # Fork of cormoran/zmk-pmw3610-driver, branched off 274c92b (the last
      # pixart,pmw3610-compatible commit, matching our overlay + v0.3 zmk fork).
      # The trackball is on always-on power (the ext-power/VEXT gating only feeds
      # the RGB underglow, NOT this sensor -- confirmed: with RGB off the rail is
      # cut on first idle and never restored, yet the ball keeps working). So on
      # idle this fork keeps the sensor force-awake instead of downshifting, and
      # does NOT re-init on wake. That removes the PMW3610 rest-exit glitch + the
      # wake re-init that together latched a one-off cursor jump when activity
      # resumed (e.g. first keypress after a pause). Earlier wake-reinit +
      # settle-discard versions only masked it. Costs a little idle current until
      # deep sleep (lower CONFIG_ZMK_IDLE_SLEEP_TIMEOUT to mitigate).
      # Branch: keep-awake-no-reinit
      remote: mhpsy
      revision: 251852fd0e1c02f14db0ba194a4b673f405bfb48
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    - name: zmk-board-eyelash
      remote: eyelash
      revision: main
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim
      revision: main
    - name: zmk-tog-io
      remote: a741725193
      revision: main
  self:
    path: config
